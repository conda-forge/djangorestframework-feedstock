schema_version: 1

context:
  version: "3.18.1"

package:
  name: djangorestframework
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/djangorestframework/djangorestframework-${{ version }}.tar.gz
  sha256: 605d79fa2ec2f02905492e5ea13d903c2d842d0b4c915a57f7bf02ab9f3c91dd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - pip
  run:
    - python >=${{ python_min }}
    - django >=5.2

tests:
  - python:
      imports:
        - rest_framework
        - rest_framework.authtoken
        - rest_framework.authtoken.migrations
        - rest_framework.templatetags
        - rest_framework.utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Web APIs for Django, made easy.
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://www.django-rest-framework.org
  repository: https://github.com/encode/django-rest-framework

extra:
  recipe-maintainers:
    - ocefpaf
    - kwilcox
